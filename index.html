const TODAY_DAY = DAYS[Math.min(new Date().getDay() - 1, 5)] || "Monday";

function getWeekKey() {
  const now = new Date();
  const jan1 = new Date(now.getFullYear(), 0, 1);
  const week = Math.ceil(((now - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${now.getFullYear()}-W${week}`;
}

function buildInitialChecks(data) {
  const out = {};
  Object.entries(data).forEach(([crew, days]) => {
    out[crew] = {};
    Object.entries(days).forEach(([day, list]) => { out[crew][day] = list.map(() => null); });
  });
  return out;
}

// ── Firebase helpers (compat SDK — disponible como window._db) ──────────────
function fbSave(weekKey, clients, checks, log) {
  if (!window._db) return Promise.resolve();
  return window._db.collection("worktracker").doc(weekKey).set({
    clients: JSON.stringify(clients),
    checks:  JSON.stringify(checks),
    log:     JSON.stringify(log),
    updatedAt: Date.now(),
  });
}

function fbListen(weekKey, cb) {
  if (!window._db) return () => {};
  return window._db.collection("worktracker").doc(weekKey).onSnapshot(snap => {
    if (!snap.exists) { cb(null); return; }
    try {
      const d = snap.data();
      cb({ clients: JSON.parse(d.clients), checks: JSON.parse(d.checks), log: JSON.parse(d.log) });
    } catch(e) { console.error("parse error", e); }
  }, err => console.error("snapshot error", err));
}

function App() {

  useEffect(() => { clientsRef.current = clients; }, [clients]);
  useEffect(() => { checksRef.current  = checks;  }, [checks]);
  useEffect(() => { logRef.current     = completionLog; }, [completionLog]);

  // ── Suscripción Firestore en tiempo real ──────────────────────────────────
  useEffect(() => {
    setSyncStatus("syncing");
    const unsub = fbListen(weekKey, data => {
      if (!data) { setSyncStatus("synced"); return; }
      setClients(data.clients);
      setChecks(data.checks);
      setCompletionLog(data.log);
      setSyncStatus("synced");
    });
    return unsub;
  }, [weekKey]);

  // ── Guardar directo en Firestore ──────────────────────────────────────────
  function save(c, ch, lg) {
    setSyncStatus("syncing");
    fbSave(weekKey, c, ch, lg)
      .then(() => setSyncStatus("synced"))
      .catch(() => setSyncStatus("error"));
  }

  function today() {
    return new Date().toLocaleDateString("es-MX", { day:"2-digit", month:"2-digit", year:"numeric" });
  }

  // ── Acciones ──────────────────────────────────────────────────────────────
  function setStatus(crew, day, idx, newStatus) {
    setChecks(prevCh => {
      const cur = prevCh[crew][day][idx];
      const fin = cur === newStatus ? null : newStatus;
      const newDayCh = [...prevCh[crew][day]]; newDayCh[idx] = fin;
      const newCh = { ...prevCh, [crew]: { ...prevCh[crew], [day]: newDayCh } };
      const clientName = clientsRef.current[crew][day][idx][1];
      setCompletionLog(prevLg => {
        const lg = prevLg.filter(e => !(e.crew===crew && e.day===day && e.client===clientName));
        if (fin) lg.push({ crew, day, client:clientName, date:today(), status:fin, id:Date.now() });
        save(clientsRef.current, newCh, lg);
        return lg;
      });
      return newCh;
    });
  }

  function markAllDone(crew, day) {
    const list = clientsRef.current[crew][day] || [];
    setChecks(prevCh => {
      const newCh = { ...prevCh, [crew]: { ...prevCh[crew], [day]: list.map(() => "done") } };
      setCompletionLog(prevLg => {
        const lg = [
          ...prevLg.filter(e => !(e.crew===crew && e.day===day)),
          ...list.map(([,name]) => ({ crew, day, client:name, date:today(), status:"done", id:Date.now()+Math.random() }))
        ];
        save(clientsRef.current, newCh, lg);
        return lg;
      });
      return newCh;
    });
  }

  function removeClient(crew, day, idx) {
    const name = clients[crew][day][idx][1];
    setClients(prevC => {
      const newC = { ...prevC, [crew]: { ...prevC[crew], [day]: prevC[crew][day].filter((_,i)=>i!==idx) } };
      setChecks(prevCh => {
        const newCh = { ...prevCh, [crew]: { ...prevCh[crew], [day]: prevCh[crew][day].filter((_,i)=>i!==idx) } };
        setCompletionLog(prevLg => {
          const lg = prevLg.filter(e => !(e.crew===crew && e.day===day && e.client===name));
          save(newC, newCh, lg);
          return lg;
        });
        return newCh;
      });
      return newC;
    });
  }

  function addClient() {
    if (!addForm.name.trim()) return;
    const { crew, day } = addModal;
    setClients(prevC => {
      const newC = { ...prevC, [crew]: { ...prevC[crew], [day]: [...prevC[crew][day], [addForm.frq, addForm.name.trim()]] } };
      setChecks(prevCh => {
        const newCh = { ...prevCh, [crew]: { ...prevCh[crew], [day]: [...prevCh[crew][day], null] } };
        save(newC, newCh, completionLog);
        return newCh;
      });
      return newC;
    });
    setAddModal(null); setAddForm({ frq:"38", name:"" });
  }

  function resetWeek() {
    const newCh = buildInitialChecks(clients);
    const newLg = [];
    const newWk = getWeekKey();
    setChecks(newCh); setCompletionLog(newLg); setWeekKey(newWk); setConfirmReset(false);
    fbSave(newWk, clients, newCh, newLg);
  }

  function saveEditDate() {
    if (!editingDate) return;
    setCompletionLog(prev => {
      const lg = prev.map(e => e.id===editingDate.id ? { ...e, date:editingDate.date } : e);
      save(clients, checks, lg);
      return lg;

  // ── Excel helpers ─────────────────────────────────────────────────────────
  async function downloadBuffer(buf, name) {
    const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=name; a.click();
    URL.revokeObjectURL(url);
  }
  function sc(cell, bold, hAlign, fgArgb, bgArgb) {
    cell.font = { bold:!!bold, name:"Arial", size:10, color:{ argb:fgArgb||"FF000000" } };
    cell.alignment = { horizontal:hAlign||"left", vertical:"middle" };
    if (bgArgb) cell.fill = { type:"pattern", pattern:"solid", fgColor:{ argb:bgArgb } };
  }
  function applyGroupBorder(ws, r1, r2, c1, c2) {
    const thick = { style:"medium", color:{ argb:"FF374151" } };
    const thin  = { style:"thin",   color:{ argb:"FFD1D5DB" } };
    for (let r=r1; r<=r2; r++) for (let c=c1; c<=c2; c++) {
      ws.getRow(r).getCell(c).border = {
        top:    r===r1?thick:thin, bottom:r===r2?thick:thin,
        left:   c===c1?thick:thin, right: c===c2?thick:thin,
      };
    }
  }

  return (
    <div style={{ minHeight:"100vh" }}>

      {/* Header */}
      <header style={{ background:"#1e293b", color:"white", padding:"16px 24px", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:10 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <img src={LOGO_SRC} alt="Ivy Green Lawn Care" style={{ width:42, height:42, borderRadius:8, background:"white", objectFit:"contain", padding:2 }} />
          <div>
            <div style={{ fontSize:20, fontWeight:700, lineHeight:1.1 }}>Ivy Green Lawn Care</div>
            <div style={{ fontSize:13, color:"#94a3b8", marginTop:2, display:"flex", alignItems:"center" }}>
              <span className={`sync-dot ${syncStatus}`}></span>
              {syncStatus==="synced"?"Sincronizado ·":syncStatus==="syncing"?"Guardando...":"Error de conexión ·"} {weekKey}
            </div>
          </div>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button onClick={()=>setActiveTab("tracker")} style={{ padding:"8px 18px", borderRadius:8, border:"none", cursor:"pointer", fontWeight:600, background:activeTab==="tracker"?"#3b82f6":"#334155", color:"white" }}>📋 Tracker</button>
          <button onClick={()=>setActiveTab("week")}    style={{ padding:"8px 18px", borderRadius:8, border:"none", cursor:"pointer", fontWeight:600, background:activeTab==="week"?"#3b82f6":"#334155", color:"white" }}>🗓️ Semana Completa</button>
          <button onClick={()=>setActiveTab("log")}     style={{ padding:"8px 18px", borderRadius:8, border:"none", cursor:"pointer", fontWeight:600, background:activeTab==="log"?"#3b82f6":"#334155", color:"white" }}>📅 Registro ({completionLog.length})</button>
          <button onClick={()=>setConfirmReset(true)}   style={{ padding:"8px 18px", borderRadius:8, border:"none", cursor:"pointer", fontWeight:600, background:"#dc2626", color:"white" }}>🔄 Nueva Semana</button>
        </div>
      </header>

      {/* Leyenda */}
      <div style={{ background:"#f1f5f9", borderBottom:"1px solid #e2e8f0", padding:"10px 24px", display:"flex", gap:20, flexWrap:"wrap", fontSize:13, color:"#475569" }}>
        <span style={{ display:"flex", alignItems:"center", gap:6 }}><span style={{ width:14, height:14, borderRadius:3, background:"#22c55e" }}></span> Realizado</span>
        <span style={{ display:"flex", alignItems:"center", gap:6 }}><span style={{ width:14, height:14, borderRadius:3, background:"#ef4444" }}></span> No realizado</span>
      </div>

      {/* Modal: Confirmar reset */}
      {confirmReset && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.4)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"white", borderRadius:12, padding:32, maxWidth:360, width:"90%", textAlign:"center" }}>
            <div style={{ fontSize:18, fontWeight:700, marginBottom:8 }}>¿Reiniciar semana?</div>
            <p style={{ color:"#64748b", fontSize:14 }}>Se borrarán todos los checks del log. Los clientes se conservan.</p>
            <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
              <button onClick={()=>setConfirmReset(false)} style={{ padding:"10px 24px", borderRadius:8, border:"1px solid #e2e8f0" }}>Cancelar</button>
              <button onClick={resetWeek} style={{ padding:"10px 24px", borderRadius:8, border:"none", background:"#dc2626", color:"white" }}>Reiniciar</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal: Agregar cliente */}
      {addModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.4)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"white", borderRadius:12, padding:28, maxWidth:380, width:"90%" }}>
            <div style={{ fontSize:16, fontWeight:700, marginBottom:16 }}>➕ Agregar Cliente</div>
            <input value={addForm.name} onChange={e=>setAddForm(p=>({...p,name:e.target.value}))} placeholder="Apellido, Nombre" style={{ width:"100%", padding:"8px 12px", marginBottom:12, boxSizing:"border-box", borderRadius:6, border:"1px solid #cbd5e1" }} />
            <input value={addForm.frq}  onChange={e=>setAddForm(p=>({...p,frq:e.target.value}))}  style={{ width:80, padding:"8px 12px", marginBottom:20, borderRadius:6, border:"1px solid #cbd5e1" }} />
            <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
              <button onClick={()=>setAddModal(null)} style={{ padding:"8px 18px", borderRadius:8, border:"1px solid #e2e8f0" }}>Cancelar</button>
              <button onClick={addClient} style={{ padding:"8px 18px", borderRadius:8, border:"none", background:"#3b82f6", color:"white" }}>Agregar</button>
            </div>
          </div>
        </div>
      )}

      {/* Modal: Editar fecha */}
      {editingDate && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.4)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ background:"white", borderRadius:12, padding:28, maxWidth:340, width:"90%" }}>
            <div style={{ fontSize:16, fontWeight:700, marginBottom:16 }}>✏️ Editar fecha — {editingDate.client}</div>
            <input type="date" value={toInputDate(editingDate.date)} onChange={e=>setEditingDate(p=>({...p,date:fromInputDate(e.target.value)}))} style={{ width:"100%", padding:"8px 12px", marginBottom:20, boxSizing:"border-box", borderRadius:6, border:"1px solid #cbd5e1" }} />
            <div style={{ display:"flex", gap:10, justifyContent:"flex-end" }}>
              <button onClick={()=>setEditingDate(null)} style={{ padding:"8px 18px", borderRadius:8, border:"1px solid #e2e8f0" }}>Cancelar</button>
              <button onClick={saveEditDate} style={{ padding:"8px 18px", borderRadius:8, border:"none", background:"#3b82f6", color:"white" }}>Guardar</button>
            </div>
          </div>
        </div>
      )}

      {/* ── TRACKER ── */}
      {activeTab==="tracker" && (
        <div style={{ padding:"16px 24px" }}>

          {/* Barra de días + búsqueda + Excel */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, marginBottom:16, flexWrap:"wrap" }}>
            <div style={{ display:"flex", gap:8, overflowX:"auto" }}>
              {DAYS.map(day => (
                <button key={day} onClick={()=>{ setActiveDay(day); setSearchQuery(""); }}
                  style={{ padding:"10px 20px", borderRadius:20, border:"none", cursor:"pointer", fontWeight:600,
                    background:activeDay===day?"#1e293b":dayColors[day],
                    color:activeDay===day?"white":"#374151" }}>
                  {day}
                </button>
              ))}
            </div>
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              <input className="search-input" placeholder="🔍 Buscar cliente..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} />
              <button onClick={exportDayToExcel}  style={{ padding:"10px 22px", borderRadius:8, border:"none", background:"#1d6f42", color:"white", fontWeight:"bold", cursor:"pointer" }}>📥 Excel Día</button>
              <button onClick={exportWeekToExcel} style={{ padding:"10px 22px", borderRadius:8, border:"none", background:"#15803d", color:"white", fontWeight:"bold", cursor:"pointer" }}>📊 Excel Semana</button>
            </div>
          </div>

          {/* Resumen del día */}
          {(() => {
            let done=0, skip=0, total=0;
            Object.entries(clients).forEach(([crew,days]) => {
              const list=days[activeDay]||[]; const ch=checks[crew]?.[activeDay]||[];
              total+=list.length; done+=ch.filter(s=>s==="done").length; skip+=ch.filter(s=>s==="skip").length;
            });
            const pct = total>0?Math.round((done/total)*100):0;
            return (
              <div style={{ display:"flex", gap:12, marginBottom:16, flexWrap:"wrap" }}>
                {[
                  { label:"✅ Realizados",    val:done,          color:"#22c55e", bg:"#f0fdf4" },
                  { label:"❌ No realizados", val:skip,          color:"#ef4444", bg:"#fff5f5" },
                  { label:"⏳ Pendientes",    val:total-done-skip,color:"#f59e0b",bg:"#fffbeb" },
                  { label:"📋 Total",         val:total,         color:"#3b82f6", bg:"#eff6ff" },
                ].map(({label,val,color,bg}) => (
                  <div key={label} style={{ background:bg, border:`1px solid ${color}30`, borderRadius:10, padding:"10px 18px", flex:1, minWidth:110, textAlign:"center" }}>
                    <div style={{ fontSize:22, fontWeight:800, color }}>{val}</div>
                    <div style={{ fontSize:12, color:"#64748b", marginTop:2 }}>{label}</div>
                  </div>
                ))}
                <div style={{ background:"white", border:"1px solid #e2e8f0", borderRadius:10, padding:"10px 18px", flex:2, minWidth:160, display:"flex", flexDirection:"column", justifyContent:"center" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, color:"#475569", marginBottom:4 }}>
                    <span>Progreso del día</span><span style={{ fontWeight:700, color:"#22c55e" }}>{pct}%</span>
                  </div>
                  <div className="progress-bar-bg">
                    <div className="progress-bar-fill" style={{ width:`${pct}%`, background:pct===100?"#22c55e":"#3b82f6" }} />
                  </div>
                </div>
              </div>
            );
          })()}

          {/* Cards de crews */}
          {Object.entries(clients).map(([crew, days]) => {
            const list = days[activeDay]||[]; const ch = checks[crew]?.[activeDay]||[];
            const done = ch.filter(s=>s==="done").length;
            const skip = ch.filter(s=>s==="skip").length;
            const total = list.length;
            const pct = total>0?Math.round((done/total)*100):0;
            const filtered = searchQuery.trim()
              ? list.map((c,i)=>({c,i})).filter(({c})=>c[1].toLowerCase().includes(searchQuery.toLowerCase()))
              : list.map((c,i)=>({c,i}));
            if (searchQuery.trim() && filtered.length===0) return null;
            return (
              <div key={crew} style={{ background:`${crewColors[crew]||"#374151"}33`, borderRadius:12, marginBottom:20, border:`1px solid ${crewColors[crew]||"#374151"}80`, overflow:"hidden" }}>
                <div style={{ background:`linear-gradient(135deg, ${crewColors[crew]||"#374151"} 0%, ${crewColors[crew]||"#374151"}dd 100%)`, color: crew==="Coyote650"?"#1f2937":"white", padding:"12px 20px", boxShadow:"0 2px 8px rgba(0,0,0,0.2)" }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6 }}>
                    <span style={{ fontWeight:700, fontSize:16 }}>{crew}</span>
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:13 }}>✅ {done} / {total} · ❌ {skip}</span>
                      <button onClick={()=>markAllDone(crew,activeDay)} style={{ background:"rgba(255,255,255,.18)", border:"1px solid rgba(255,255,255,.3)", color:"white", padding:"4px 10px", borderRadius:6, cursor:"pointer", fontSize:12 }}>✔ Todos</button>
                      <button onClick={()=>setAddModal({crew,day:activeDay})} style={{ background:"rgba(255,255,255,.2)", border:"none", color:"white", padding:"5px 10px", borderRadius:6, cursor:"pointer" }}>+ Agregar</button>
                    </div>
                  </div>
                  <div className="progress-bar-bg" style={{ background:"rgba(255,255,255,.25)" }}>
                    <div className="progress-bar-fill" style={{ width:`${pct}%`, background:pct===100?"#4ade80":"rgba(255,255,255,.85)" }} />
                  </div>
                </div>
                <div style={{ padding:"4px 0" }}>
                  {total===0 ? (
                    <div style={{ padding:20, color:"#94a3b8", textAlign:"center", fontSize:14 }}>Sin clientes asignados</div>
                  ) : filtered.map(({c:[frq,name],i:idx}) => {
                    const status = ch[idx]||null;
                    return (
                      <div key={idx} style={rowStyle(status, idx===total-1)}>
                        <input type="checkbox" checked={status==="done"} onChange={()=>setStatus(crew,activeDay,idx,"done")} style={{ width:18, height:18 }} />
                        <input type="checkbox" checked={status==="skip"} onChange={()=>setStatus(crew,activeDay,idx,"skip")} style={{ width:18, height:18 }} />
                        <span style={{ fontSize:12, fontWeight:800, background:"#1e293b", color:"#facc15", padding:"3px 6px", borderRadius:4 }}>{frq}</span>
                        <span style={{ flex:1, fontSize:14, textDecoration:status==="done"?"line-through":"none" }}>
                          {name} {status&&`(${status==="done"?"✅ Realizado":"❌ Saltado"})`}
                        </span>
                        <button onClick={()=>removeClient(crew,activeDay,idx)} style={{ background:"none", border:"none", color:"#ef4444", cursor:"pointer" }}>✕</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── SEMANA COMPLETA ── */}
      {activeTab==="week" && (
        <div style={{ padding:"16px 24px" }}>
          <div style={{ marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
            <div style={{ fontSize:18, fontWeight:700, color:"#1e293b" }}>🗓️ Vista de Semana Completa</div>
            <button onClick={exportWeekToExcel} style={{ padding:"10px 22px", borderRadius:8, border:"none", background:"#15803d", color:"white", fontWeight:"bold", cursor:"pointer" }}>📊 Excel Semana</button>
          </div>

          {Object.entries(clients).map(([crew, days]) => {
            const crewTotal = DAYS.reduce((a,d)=>a+(days[d]||[]).length, 0);
            const crewDone  = DAYS.reduce((a,d)=>a+(checks[crew]?.[d]||[]).filter(s=>s==="done").length, 0);
            const crewPct = crewTotal>0?Math.round((crewDone/crewTotal)*100):0;
            return (
              <div key={crew} style={{ background:`${crewColors[crew]||"#374151"}33`, borderRadius:12, marginBottom:24, border:`1px solid ${crewColors[crew]||"#374151"}80`, overflow:"hidden" }}>
                <div style={{ background:`linear-gradient(135deg, ${crewColors[crew]||"#374151"} 0%, ${crewColors[crew]||"#374151"}dd 100%)`, color: crew==="Coyote650"?"#1f2937":"white", padding:"10px 16px", boxShadow:"0 2px 8px rgba(0,0,0,0.2)" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                    <span style={{ fontWeight:700, fontSize:15 }}>{crew}</span>
                    <span style={{ fontSize:12 }}>✅ {crewDone} / {crewTotal}</span>
                  </div>
                  <div className="progress-bar-bg" style={{ background:"rgba(255,255,255,.25)" }}>
                    <div className="progress-bar-fill" style={{ width:`${crewPct}%`, background:crewPct===100?"#4ade80":"rgba(255,255,255,.85)" }} />
                  </div>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(6, minmax(160px, 1fr))", gap:0, overflowX:"auto" }}>
                  {DAYS.map((day, di) => {
                    const list = days[day]||[]; const ch = checks[crew]?.[day]||[];
                    return (
                      <div key={day} style={{ borderLeft: di>0?"1px solid #f1f5f9":"none", minWidth:160 }}>
                        <div style={{ background:dayColors[day], padding:"6px 10px", fontSize:12, fontWeight:700, color:"#374151", textAlign:"center", borderBottom:"1px solid #e2e8f0" }}>
                          {day} {list.length>0 && <span style={{ color:"#64748b", fontWeight:500 }}>({ch.filter(s=>s==="done").length}/{list.length})</span>}
                        </div>
                        {list.length===0 ? (
                          <div style={{ padding:"14px 10px", color:"#cbd5e1", fontSize:12, textAlign:"center" }}>—</div>
                        ) : list.map(([frq,name], idx) => {
                          const status = ch[idx]||null;
                          return (
                            <div key={idx} style={{
                              display:"flex", alignItems:"center", gap:6, padding:"6px 10px", fontSize:12,
                              borderBottom:"1px solid #f8fafc",
                              background: status==="done"?"#bbf7d0":status==="skip"?"#fecaca":"white",
                            }}>
                              <input type="checkbox" checked={status==="done"} onChange={()=>setStatus(crew,day,idx,"done")} style={{ width:14, height:14, flexShrink:0 }} title="Realizado" />
                              <input type="checkbox" checked={status==="skip"} onChange={()=>setStatus(crew,day,idx,"skip")} style={{ width:14, height:14, flexShrink:0 }} title="No realizado" />
                              <span style={{ fontSize:10, fontWeight:800, background:"#1e293b", color:"#facc15", padding:"1px 4px", borderRadius:3, flexShrink:0 }}>{frq}</span>
                              <span style={{ flex:1, textDecoration:status==="done"?"line-through":"none", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }} title={name}>{name}</span>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── LOG ── */}
      {activeTab==="log" && (
        <div style={{ padding:"16px 24px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, marginBottom:20, flexWrap:"wrap", background:"#f1f5f9", padding:16, borderRadius:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <span style={{ fontWeight:"bold", fontSize:14, color:"#475569" }}>Filtrar por:</span>
              <select value={logFilter} onChange={e=>setLogFilter(e.target.value)} style={{ padding:"8px 12px", borderRadius:8, border:"1px solid #cbd5e1", fontSize:14 }}>
                <option value="all">Semana actual ({completionLog.length})</option>
                <option value="day">Solo hoy</option>
                <option value="month">Mes en curso</option>
              </select>
            </div>
            <button onClick={exportLogToExcel} style={{ padding:"10px 22px", borderRadius:8, border:"none", background:"#1d6f42", color:"white", fontWeight:"bold", cursor:"pointer" }}>📥 Descargar Excel</button>
          </div>
          <div style={{ background:"white", borderRadius:12, border:"1px solid #e2e8f0", overflow:"hidden" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:14, textAlign:"left" }}>
              <thead>
                <tr style={{ background:"#1e293b", color:"white" }}>
                  {["Estado","Crew","Día Asignado","Cliente","Fecha de Registro"].map(h => (
                    <th key={h} style={{ padding:"12px 16px" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filteredLogs.length===0 ? (
                  <tr><td colSpan="5" style={{ padding:30, textAlign:"center", color:"#94a3b8" }}>No hay registros con ese filtro.</td></tr>
                ) : filteredLogs.map(entry => (
                  <tr key={entry.id} style={{ borderBottom:"1px solid #f1f5f9", background:entry.status==="done"?"#f0fdf4":"#fff5f5" }}>
                    <td style={{ padding:"12px 16px", fontWeight:"bold" }}>{entry.status==="done"?"✅ Realizado":"❌ No realizado"}</td>
                    <td style={{ padding:"12px 16px" }}>{entry.crew}</td>
                    <td style={{ padding:"12px 16px" }}>{entry.day}</td>
                    <td style={{ padding:"12px 16px" }}>{entry.client}</td>
                    <td style={{ padding:"12px 16px" }}>
                      {entry.date}
                      <button onClick={()=>setEditingDate({id:entry.id,date:entry.date,client:entry.client})} style={{ marginLeft:8, padding:"2px 6px", cursor:"pointer", borderRadius:4, border:"1px solid #e2e8f0" }}>✏️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{ padding:40, fontFamily:"monospace", color:"#dc2626" }}>
        <h2>❌ Error al cargar la app</h2>
        <pre style={{ background:"#fff5f5", padding:16, borderRadius:8, whiteSpace:"pre-wrap" }}>{String(this.state.error)}</pre>
        <p style={{ color:"#64748b" }}>Abre la consola del navegador (F12 → Console) para más detalles.</p>
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
